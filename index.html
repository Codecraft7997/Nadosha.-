
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>نونتي ♡</title>

<link rel="stylesheet" href="style.css">

<style>
:root {
  --gold: #e8d2a0;
  --cream: #fff8ed;
  --muted: #e2dcd2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: "Tahoma", Arial, sans-serif;
  background: #101827;
}

/* حط رابط صورتك مكان الرابط بين علامتي التنصيص */
.page-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: url("PUT-YOUR-BACKGROUND-IMAGE-URL-HERE");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* طبقة بتخلي الكلام واضح فوق الخلفية */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    135deg,
    rgba(8, 16, 31, .78),
    rgba(17, 26, 43, .62),
    rgba(10, 15, 27, .82)
  );
}

.wrap {
  width: min(100% - 32px, 950px);
  min-height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 0;
  gap: 12px;
}

.logo {
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 2px;
}

.tag {
  color: #eee3ce;
  font-size: 13px;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero {
  width: 100%;
  max-width: 730px;
  padding: clamp(28px, 7vw, 65px) clamp(18px, 5vw, 55px);
  border: 1px solid rgba(232, 210, 160, .4);
  border-radius: 30px;
  background: rgba(13, 22, 37, .57);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 25px 80px rgba(0, 0, 0, .3);
  animation: appear 1s ease both;
}

.orb {
  width: 92px;
  height: 92px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  border-radius: 50%;
  border: 1px solid rgba(232, 210, 160, .65);
  background: linear-gradient(145deg, #e8d2a025, #ffffff08);
  box-shadow: 0 0 35px rgba(232, 210, 160, .12);
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 16px;
}

h1 {
  color: var(--cream);
  font-size: clamp(32px, 7vw, 58px);
  line-height: 1.5;
  margin: 0 0 18px;
}

#homeIntro {
  color: var(--muted);
  font-size: clamp(15px, 2.5vw, 18px);
  line-height: 2.1;
  max-width: 530px;
  margin: 0 auto 30px;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 200px;
  padding: 15px 28px;
  color: #172033;
  background: linear-gradient(135deg, #f5e7c5, #d4b77b);
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  border-radius: 14px;
  border: 1px solid #f9e9c7;
  box-shadow: 0 8px 30px #00000030;
  transition: transform .25s, box-shadow .25s;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px #d4b77b35;
}

.small {
  color: #e8d2a0;
  font-size: 13px;
  margin-top: 22px;
}

footer {
  text-align: center;
  padding: 25px 0;
  color: #e5d9c2;
  font-size: 13px;
  line-height: 2;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 500px) {
  header {
    flex-direction: column;
    justify-content: center;
  }

  .hero {
    border-radius: 24px;
  }
}
</style>
</head>

<body data-page="home">

<div id="pageBg" class="page-bg"></div>

<div class="wrap">

  <header>
    <div class="logo">♡ NONTY PROJECT</div>
    <div class="tag">حكاية معمولة مخصوص ليكي ✨</div>
  </header>

  <main>
    <section class="hero">

      <div class="orb">💌</div>

      <div class="eyebrow">A LITTLE WORLD JUST FOR YOU</div>

      <h1 id="homeTitle"> دي ليكي ي عمري ♡</h1>

      <p id="homeIntro">
        عملتلك حاجه صغيرة كده اتمني اتمني تعجبك
      </p>

      <a class="btn" href="pages.html">
        يلا نبدأ الحكاية ✨
      </a>

      <div class="small">
        اعرفي ف كل لحظه اني بحبك اوي♡
      </div>

    </section>
  </main>

  <footer>
    معمول مخصوص ليكي بكل الحب 🤍
  </footer>

</div>

<div id="toast" class="toast" role="status"></div>
<script src="script.js"></script>

</body>
</html>
